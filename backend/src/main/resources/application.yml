server:
  port: 8081

spring:
  datasource:
    url: jdbc:sqlite:${DATA_PATH:./data}/paiagent.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: com.paiagent.config.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  jackson:
    default-property-inclusion: non_null
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

# Workflow Engine Configuration
engine:
  type: ${ENGINE_TYPE:dag}  # dag or langgraph

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:paiagent-jwt-secret-at-least-32-characters}
  expiration: 86400000  # 24 hours

# LLM API Keys (used by SpringAiChatService)
llm:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com/v1
  qwen:
    api-key: ${QWEN_API_KEY:}
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  chatglm:
    api-key: ${CHATGLM_API_KEY:}
    base-url: https://open.bigmodel.cn/api/paas/v4
  aiping:
    api-key: ${AIPING_API_KEY:}
    base-url: ${AIPING_BASE_URL:}

# TTS Configuration
tts:
  api-key: ${TTS_API_KEY:}
  base-url: ${TTS_BASE_URL:}

# File storage
storage:
  audio-path: ${DATA_PATH:./data}/audio
