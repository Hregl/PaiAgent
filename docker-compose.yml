version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - CHATGLM_API_KEY=${CHATGLM_API_KEY}
      - TTS_API_KEY=${TTS_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-paiagent-secret-key-must-be-at-least-32chars}
      - SPRING_PROFILES_ACTIVE=prod
