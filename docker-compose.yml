services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - CHATGLM_API_KEY=${CHATGLM_API_KEY}
      - AIPING_API_KEY=${AIPING_API_KEY:-}
      - AIPING_BASE_URL=${AIPING_BASE_URL:-}
      - TTS_API_KEY=${TTS_API_KEY:-}
      - TTS_BASE_URL=${TTS_BASE_URL:-}
      - JWT_SECRET=${JWT_SECRET:-paiagent-secret-key-must-be-at-least-32chars}
      - ENGINE_TYPE=${ENGINE_TYPE:-langgraph}
      - SPRING_PROFILES_ACTIVE=prod
